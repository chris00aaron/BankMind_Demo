# ============================================================
# BankMind Backend — Perfil Docker
# Sobreescribe las propiedades sensibles con variables de entorno
# El perfil se activa con: --spring.profiles.active=docker
# ============================================================

# ── Database ─────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# ── Email ────────────────────────────────────────────────────
spring.mail.password=${MAIL_PASSWORD}
spring.mail.username=${MAIL_USERNAME}

# ── CORS ─────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ORIGINS:*}

# ── CONFIGURACIÓN MAESTRA DE SERVICIOS ──
# Al sobrescribir estas dos variables maestras, automáticamente 
# todos los endpoints derivados apuntarán a los contenedores Docker adecuadamente.
bankmind.url.prediction-api=${PREDICTION_API_URL}
bankmind.url.self-training-api=${SELF_TRAINING_API_URL}